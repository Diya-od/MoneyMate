<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoneyMate — Budget</title>
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="budget.css" />
</head>
<body>
<div class="layout">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">💰</div>
      <div>
        <div class="logo-text">MoneyMate</div>
        <div class="logo-sub">Personal Finance</div>
      </div>
    </div>
    <nav class="nav-menu">
      <div class="nav-section-label">Menu</div>
      <a href="dashboard.html"    class="nav-link"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
      <a href="transactions.html" class="nav-link"><span class="nav-icon">💰</span><span class="nav-label">Transactions</span></a>
      <a href="savings.html"      class="nav-link"><span class="nav-icon">💵</span><span class="nav-label">Savings</span></a>
      <a href="assets.html"       class="nav-link"><span class="nav-icon">🏦</span><span class="nav-label">Assets</span></a>
      <a href="budget.html"       class="nav-link"><span class="nav-icon">📊</span><span class="nav-label">Budget</span></a>
      <a href="history.html"      class="nav-link"><span class="nav-icon">📜</span><span class="nav-label">Money History</span></a>
    </nav>
    <div class="sidebar-footer">MoneyMate v1.0 &nbsp;·&nbsp; All data local</div>
  </aside>
  <div id="sidebarOverlay"></div>

  <div class="main-content">
    <header class="top-header">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div>
          <div class="header-title">Monthly Budget</div>
          <div class="header-subtitle" id="budgetMonthLabel">Current month</div>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-primary" id="editBudgetBtn">✏️ Edit Budgets</button>
      </div>
    </header>

    <main class="page-content">
      <div class="budget-summary-bar" id="budgetSummaryChips"></div>
      <div class="budget-list" id="budgetList"></div>
    </main>
  </div>
</div>

<!-- Edit Budget Modal -->
<div class="modal-overlay" id="budgetModal">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div class="modal-title">📊 Set Monthly Budgets</div>
      <button class="modal-close" id="budgetModalClose">✕</button>
    </div>
    <div class="modal-body" id="budgetModalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="budgetCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBudgetBtn">Save Budgets</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="budget.js"></script>
</body>
</html>
